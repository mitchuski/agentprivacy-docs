<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Programme Academic Reader</title>
<style>
  :root {
    --bg:#12141a; --panel:#1a1e27; --card:#212633; --ink:#e8e6df; --dim:#9aa0ae;
    --accent:#d4a94f; --line:#323949; --ok:#7fbf7f; --link:#8ab4d8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 Georgia,'Times New Roman',serif; }
  header { padding:20px 28px 12px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:21px; letter-spacing:.4px; font-weight:normal; }
  header h1 b { color:var(--accent); font-weight:normal; }
  header .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .wrap { display:flex; height:calc(100vh - 78px); }
  .list { width:460px; min-width:380px; overflow-y:auto; padding:14px 16px 40px;
          border-right:1px solid var(--line); background:var(--panel); }
  .viewer { flex:1; background:#0d0f13; display:flex; flex-direction:column; }
  .viewer iframe { flex:1; border:0; width:100%; }
  .viewer .empty { flex:1; display:flex; align-items:center; justify-content:center;
                   color:var(--dim); font-style:italic; }
  .grouph { color:var(--dim); text-transform:uppercase; font-size:11px;
            letter-spacing:1.6px; margin:18px 4px 8px; font-family:Verdana,sans-serif; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px;
          padding:10px 12px 8px; margin-bottom:8px; cursor:grab; position:relative; }
  .card.dragging { opacity:.45; }
  .card.active { border-color:var(--accent); }
  .card .t { font-size:14.5px; margin-right:34px; }
  .card .t a { color:var(--ink); text-decoration:none; }
  .card .t a:hover { color:var(--accent); }
  .card .meta { color:var(--dim); font-size:12px; margin-top:3px; font-family:Verdana,sans-serif; }
  .card .meta .wp { color:var(--accent); }
  .badge { position:absolute; top:8px; right:10px; background:var(--bg);
           border:1px solid var(--line); border-radius:12px; min-width:24px; text-align:center;
           padding:1px 7px; color:var(--accent); font-family:Verdana,sans-serif; font-size:12px; }
  .links { margin-top:5px; font-size:12px; font-family:Verdana,sans-serif; }
  .links a { color:var(--link); text-decoration:none; margin-right:12px; }
  .links a:hover { text-decoration:underline; }
  .note { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line);
          border-radius:5px; margin-top:6px; padding:4px 7px; font:12.5px Verdana,sans-serif;
          display:none; }
  .card.active .note, .note.hasText { display:block; }
  .toolbar { padding:10px 4px 2px; display:flex; gap:8px; }
  .toolbar button { background:var(--card); color:var(--ink); border:1px solid var(--line);
          border-radius:6px; padding:5px 12px; cursor:pointer; font:12.5px Verdana,sans-serif; }
  .toolbar button:hover { border-color:var(--accent); }
  #copied { color:var(--ok); font-size:12px; align-self:center; display:none; }
</style>
</head>
<body>
<header>
  <h1><b>Privacy-is-Value</b> · Programme Academic Reader</h1>
  <div class="sub">drag cards to set your review/publication order · click a title to preview ·
    add a note on any card · <i>Copy order</i> exports the numbered list + notes for paste-back</div>
</header>
<div class="wrap">
  <div class="list">
    <div class="toolbar">
      <button id="copyBtn">Copy order + notes</button>
      <button id="resetBtn">Reset order</button>
      <span id="copied">copied ✓</span>
    </div>
    <div id="cards"></div>
  </div>
  <div class="viewer">
    <div class="empty" id="empty">select a document to preview its PDF</div>
    <iframe id="frame" style="display:none"></iframe>
  </div>
</div>
<script>
const GROUPS = [["paper","Tier-A papers"],["litreview","Literature review"],
                ["companion","Companion"],["support","Supporting artefacts"]];
const LS_ORDER = "programme_reader_order_v1", LS_NOTES = "programme_reader_notes_v1";
let docs = [], notes = JSON.parse(localStorage.getItem(LS_NOTES) || "{}");

fetch("manifest.json").then(r => r.json()).then(m => {
  docs = m;
  const saved = JSON.parse(localStorage.getItem(LS_ORDER) || "null");
  if (saved) docs.sort((a,b) => (saved.indexOf(a.name)+1||99) - (saved.indexOf(b.name)+1||99));
  render();
}).catch(e => {
  document.getElementById("cards").innerHTML =
    `<div style="color:#d47b6a;padding:14px">could not load manifest.json (${e}). ` +
    `Is the server running? <code>python build/serve_programme.py</code></div>`;
});

function order() { return [...document.querySelectorAll(".card")].map(c => c.dataset.name); }
function saveOrder() { localStorage.setItem(LS_ORDER, JSON.stringify(order())); renumber(); }
function renumber() {
  document.querySelectorAll(".card").forEach((c,i) => c.querySelector(".badge").textContent = i+1);
}

function render() {
  const host = document.getElementById("cards"); host.innerHTML = "";
  for (const [g, label] of GROUPS) {
    const items = docs.filter(d => d.group === g);
    if (!items.length) continue;
    const h = document.createElement("div"); h.className = "grouph"; h.textContent = label;
    host.appendChild(h);
    for (const d of items) host.appendChild(card(d));
  }
  renumber();
}

function card(d) {
  const el = document.createElement("div");
  el.className = "card"; el.draggable = true; el.dataset.name = d.name;
  const meta = [d.wp && `<span class="wp">${d.wp.split("(")[0].trim()}</span>`, d.venue, d.status,
                d.date, d.pages && d.pages + "pp"].filter(Boolean).join(" · ");
  el.innerHTML = `<span class="badge"></span>
    <div class="t"><a href="#">${d.title}</a></div>
    <div class="meta">${meta}</div>
    <div class="links"><a href="${d.name}.pdf" target="_blank">open PDF ↗</a>
      <a href="/build/tex/programme/${d.name}.tex" download>.tex</a>
      <a href="#" class="noteBtn">note</a></div>
    <input class="note" placeholder="note for this doc (saved locally)">`;
  const note = el.querySelector(".note");
  note.value = notes[d.name] || ""; if (note.value) note.classList.add("hasText");
  note.oninput = () => { notes[d.name] = note.value;
    localStorage.setItem(LS_NOTES, JSON.stringify(notes));
    note.classList.toggle("hasText", !!note.value); };
  el.querySelector(".t a").onclick = e => { e.preventDefault(); preview(d, el); };
  el.querySelector(".noteBtn").onclick = e => { e.preventDefault();
    note.style.display = "block"; note.focus(); };
  el.addEventListener("dragstart", () => el.classList.add("dragging"));
  el.addEventListener("dragend", () => { el.classList.remove("dragging"); saveOrder(); });
  el.addEventListener("dragover", e => {
    e.preventDefault();
    const dragging = document.querySelector(".card.dragging");
    if (!dragging || dragging === el) return;
    const r = el.getBoundingClientRect();
    el.parentNode.insertBefore(dragging, (e.clientY - r.top) > r.height/2 ? el.nextSibling : el);
  });
  return el;
}

function preview(d, el) {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("empty").style.display = "none";
  const f = document.getElementById("frame");
  f.style.display = "block"; f.src = d.name + ".pdf";
}

document.getElementById("copyBtn").onclick = () => {
  const byName = Object.fromEntries(docs.map(d => [d.name, d]));
  const lines = order().map((n,i) => {
    const d = byName[n] || {title:n};
    return `${i+1}. ${d.title} [${n}]` + (notes[n] ? `\n   note: ${notes[n]}` : "");
  });
  navigator.clipboard.writeText("Review order (Programme Academic Reader):\n" + lines.join("\n"))
    .then(() => { const c = document.getElementById("copied");
      c.style.display = "inline"; setTimeout(() => c.style.display = "none", 1600); });
};
document.getElementById("resetBtn").onclick = () => {
  localStorage.removeItem(LS_ORDER); location.reload();
};
</script>
</body>
</html>
